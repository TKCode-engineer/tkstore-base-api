<body style="font-family: sans-serif; line-height: 1.6; padding: 40px; max-width: 800px;">

  <h1>TKstore API連携アプリ</h1>

  <p>
    本アプリは、TKstore（BASEショップ）における商品情報を取得・管理するためのAPI連携アプリです。
  </p>

  <h2>機能概要</h2>
  <ul>
    <li>BASEショップの商品情報の取得</li>
    <li>在庫情報の確認</li>
    <li>商品データ管理の補助</li>
    <li>ショップ運営効率化のためのデータ連携</li>
  </ul>

  <h2>注意事項</h2>
  <p>
    本アプリは開発中のシステムであり、運営効率化を目的とした内部利用を想定しています。
  </p>

  <h2>開発者</h2>
  <p>TKstore</p>

</html>
